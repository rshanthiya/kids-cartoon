<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StreamVerse | Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="auth-page" data-page="register">
  <div class="login-shell narrow">
    <div class="brand-bar">
      <div class="brand">StreamVerse</div>
      <a href="/" class="back-link">← Back</a>
    </div>

    <div class="single-login-card parent-card">
      <div class="icon-box parent-icon">📝</div>
      <div class="card-badge parent-badge">Register</div>
      <h2>Create account</h2>
      <p>Register first to access the kids or parent library.</p>

      <div id="form-message" class="form-message"></div>

      <form id="register-form" class="auth-form">
        <label>
          Role
          <select name="role" required>
            <option value="kid">Kid</option>
            <option value="parent">Parent</option>
          </select>
        </label>

        <label>
          Full name
          <input type="text" name="name" required placeholder="Enter your name" />
        </label>

        <label>
          Email
          <input type="email" name="email" required placeholder="you@example.com" />
        </label>

        <label>
          Age
          <input type="number" name="age" min="1" max="100" required placeholder="Enter age" />
        </label>

        <label>
          Password
          <input type="password" name="password" required placeholder="Create a password" />
        </label>

        <label>
          Confirm password
          <input type="password" name="confirmPassword" required placeholder="Repeat your password" />
        </label>

        <button type="submit">Register and continue</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
