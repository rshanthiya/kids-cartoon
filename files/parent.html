<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StreamVerse | Parent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="parent-page streaming-page" data-page="parent">
  <header class="topbar">
    <div class="brand-wrap">
      <div class="brand">StreamVerse</div>
      <nav class="main-nav">
        <span>Home</span>
        <span>Movies</span>
        <span>TV Shows</span>
      </nav>
    </div>
    <div class="user-meta">
      <div class="user-pill" id="welcome-name">Welcome</div>
      <button class="logout-btn" id="logout-btn">Logout</button>
    </div>
  </header>

  <section class="hero-banner parent-hero">
    <div class="hero-content">
      <span class="tagline">Adults only</span>
      <h1>Parent library</h1>
      <p>Full access for adults 18+, including documentaries, thrillers, drama, and premium entertainment.</p>
      <div class="hero-actions">
        <button>▶ Watch now</button>
        <button class="secondary">+ My list</button>
      </div>
    </div>
  </section>

  <section class="content-section">
    <div class="section-head">
      <h2>Trending now</h2>
    </div>
    <div class="video-grid" id="video-list"></div>
  </section>

  <script src="app.js"></script>
</body>
</html>
